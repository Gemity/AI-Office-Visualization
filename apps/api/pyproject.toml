[project]
name = "office-api"
version = "0.1.0"
description = "AI Project Office API (FastAPI + WebSocket)"
requires-python = ">=3.12"
dependencies = [
    "office-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "agent-adapters",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]

[project.scripts]
office-api = "office_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/office_api"]

[tool.uv.sources]
agent-adapters = { workspace = true }
