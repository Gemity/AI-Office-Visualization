<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Project Office</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Silkscreen&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="po.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span><span class="brand-name">AI PROJECT OFFICE</span></div>
    <select id="projectSelect" class="po-select" aria-label="Project"></select>
    <button id="newProject" class="po-btn" type="button">+ Project</button>
    <span id="connPill" class="po-pill off">offline</span>
    <button id="approvalPill" class="po-pill po-approval-pill" type="button" hidden></button>
    <button id="projectPause" class="po-btn" type="button" hidden></button>
    <div class="tools"><button id="logout" class="po-btn ghost" type="button">Đăng xuất</button></div>
  </header>

  <div class="po-main">
    <main class="stage">
      <div class="office-wrap"><canvas id="office"></canvas><div class="labels" id="labels"></div></div>
      <div class="roster" id="roster"></div>
      <p class="po-note" id="officeNote"></p>
    </main>

    <aside class="po-panel">
      <nav class="po-tabs" id="tabs">
        <button data-tab="chat" class="active" type="button">Chat</button>
        <button data-tab="tasks" type="button">Task</button>
        <button data-tab="talks" type="button">Họp &amp; DM</button>
        <button data-tab="artifacts" type="button">Artifact</button>
        <button data-tab="metrics" type="button">Chi phí</button>
        <button data-tab="timeline" type="button">Timeline</button>
        <button data-tab="agents" type="button">Agent</button>
        <button data-tab="agent" type="button" hidden id="agentTabBtn">Chi tiết</button>
      </nav>

      <section class="po-tab active" id="tab-chat">
        <div id="approvalBox"></div>
        <div class="po-log" id="chatLog"></div>
        <div class="po-busy" id="orchBusy" hidden></div>
        <form class="po-compose" id="chatForm">
          <textarea id="chatInput" rows="3" placeholder="Nhắn cho Điều phối viên… (Ctrl+Enter để gửi)"></textarea>
          <button class="po-btn primary" type="submit">Gửi</button>
        </form>
        <p class="po-error" id="chatError" hidden></p>
      </section>

      <section class="po-tab" id="tab-tasks"><div id="taskBoard"></div></section>

      <section class="po-tab" id="tab-talks">
        <div id="talkList"></div>
        <div id="talkView"></div>
      </section>

      <section class="po-tab" id="tab-artifacts">
        <div id="artifactList"></div>
        <div id="artifactView"></div>
      </section>

      <section class="po-tab" id="tab-metrics"><div id="metricsView"></div></section>

      <section class="po-tab" id="tab-timeline">
        <div class="po-row"><select id="tlFilter" class="po-select"></select><span class="po-muted" id="tlCount"></span></div>
        <ol class="po-timeline" id="timeline"></ol>
      </section>

      <section class="po-tab" id="tab-agents">
        <div id="agentList"></div>
        <form class="po-form" id="agentForm">
          <h3 id="agFormTitle">Thêm worker</h3>
          <p class="po-muted">Điều phối được cấu hình ở đầu file <code>office-launch.py</code>.</p>
          <label>Tên <input id="agName" required maxlength="200" /></label>
          <label>Adapter <select id="agAdapter" class="po-select"></select></label>
          <div class="po-muted" id="agAdapterNote"></div>
          <fieldset class="po-caps">
            <legend>Capabilities</legend>
            <div id="agCaps"></div>
          </fieldset>
          <label>Config (JSON) <textarea id="agConfig" rows="5">{}</textarea></label>
          <details class="po-help">
            <summary>Hướng dẫn config <button class="po-btn po-mini" type="button" id="agSample">Điền mẫu</button></summary>
            <div id="agHelp"></div>
          </details>
          <div class="po-row">
            <button class="po-btn primary" type="submit" id="agSubmit">Thêm</button>
            <button class="po-btn" type="button" id="agCancel" hidden>Huỷ</button>
          </div>
          <p class="po-error" id="agentError" hidden></p>
        </form>
      </section>

      <section class="po-tab" id="tab-agent"><div id="agentDetail"></div></section>
    </aside>
  </div>

  <div class="po-overlay" id="login" hidden>
    <form class="po-form po-card" id="loginForm">
      <h3>Đăng nhập</h3>
      <p class="po-muted">Dán token tạo bằng <code>uv run office-api create-owner --name "Tên"</code>.</p>
      <input id="tokenInput" placeholder="po_…" autocomplete="off" required />
      <button class="po-btn primary" type="submit">Vào</button>
      <p class="po-error" id="loginError" hidden></p>
    </form>
  </div>

  <script src="po-config.js"></script>
  <script src="layout.js"></script>
  <script src="office.js"></script>
  <script src="po-app.js"></script>
</body>
</html>
