[project]
name = "ai-project-office"
version = "0.0.0"
description = "AI Project Office — workspace root"
requires-python = ">=3.12"
dependencies = ["office-api", "office-contracts", "agent-adapters"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "jsonschema>=4.23", "ruff>=0.6"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "packages/contracts", "packages/agent-adapters"]

[tool.uv.sources]
office-api = { workspace = true }
office-contracts = { workspace = true }
agent-adapters = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/agent-adapters/tests", "tests/e2e"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerate output: long one-line column/index definitions.
"apps/api/src/office_api/migrations/versions/*.py" = ["E501"]
# e2e modules import the `server` fixture from harness.py (no conftest there:
# it would collide with apps/api/tests/conftest.py).
"tests/e2e/test_*.py" = ["F811"]
