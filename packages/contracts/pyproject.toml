[project]
name = "office-contracts"
version = "0.1.0"
description = "Event envelope and agent adapter contracts (source of truth for the JSON schemas)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/office_contracts"]
