[project]
name = "agent-adapters"
version = "0.1.0"
description = "AgentAdapter protocol and provider adapters"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.174",
    "office-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_adapters"]
